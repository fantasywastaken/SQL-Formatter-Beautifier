[package]
name = "sqlfmt"
version = "0.1.0"
edition = "2021"
authors = ["fantasywastaken"]
description = "Format and beautify SQL for PostgreSQL, MySQL, SQLite, and T-SQL"
autobins = false

[[bin]]
name = "sqlfmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
sqlformat = "0.2"
